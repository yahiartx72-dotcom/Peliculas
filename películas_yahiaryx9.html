<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YAHIARTXHUB // Premium Streaming Hub</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@500;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-base: #06080f;
            --bg-card: rgba(18, 22, 34, 0.65);
            --bg-card-hover: rgba(28, 34, 51, 0.85);
            --border-glass: rgba(255, 255, 255, 0.08);
            --border-glow: rgba(255, 42, 95, 0.4);
            --accent: #ff2a5f;
            --accent-gradient: linear-gradient(135deg, #ff2a5f 0%, #ff6b35 100%);
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --shadow-glass: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', 'Inter', sans-serif; }
        
        body { 
            background-color: var(--bg-base); 
            color: var(--text-main); 
            min-height: 100vh; 
            padding: 24px;
            background-image: 
                radial-gradient(circle at 10% 20%, rgba(255, 42, 95, 0.07) 0%, transparent 40%),
                radial-gradient(circle at 90% 80%, rgba(59, 130, 246, 0.06) 0%, transparent 40%);
            background-attachment: fixed;
            overflow-x: hidden;
        }
        
        header { 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            background: rgba(13, 17, 26, 0.7);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--border-glass);
            padding: 18px 28px; 
            border-radius: 16px;
            margin-bottom: 35px; 
            flex-wrap: wrap; 
            gap: 20px;
            box-shadow: var(--shadow-glass);
            position: sticky;
            top: 20px;
            z-index: 100;
        }

        .logo { 
            font-size: 22px; 
            font-weight: 800; 
            background: var(--accent-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: 1.5px;
            text-transform: uppercase;
        }
        
        .control-cluster { 
            display: flex; 
            gap: 14px; 
            flex-wrap: wrap; 
            align-items: center; 
        }

        input, select, button { 
            background: rgba(22, 27, 39, 0.8);
            border: 1px solid var(--border-glass); 
            color: var(--text-main); 
            padding: 12px 20px; 
            border-radius: 10px; 
            outline: none; 
            font-size: 14px; 
            font-weight: 500;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            backdrop-filter: blur(10px);
        }

        input:focus, select:focus { 
            border-color: var(--accent); 
            box-shadow: 0 0 20px var(--border-glow);
            background: rgba(28, 35, 50, 0.9);
        }

        .search-input { width: 320px; }
        
        .action-btn { 
            background: var(--accent-gradient);
            color: white; 
            border: none; 
            font-weight: 700; 
            cursor: pointer; 
            letter-spacing: 0.5px;
            box-shadow: 0 4px 15px rgba(255, 42, 95, 0.3);
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        .action-btn:hover { 
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(255, 42, 95, 0.5);
        }

        .grid { 
            display: grid; 
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); 
            gap: 28px; 
            animation: fadeIn 0.6s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .card { 
            background: var(--bg-card); 
            border: 1px solid var(--border-glass); 
            border-radius: 14px; 
            overflow: hidden; 
            transition: all 0.35s cubic-bezier(0.16, 1, 0.3, 1);
            cursor: pointer; 
            display: flex; 
            flex-direction: column;
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            box-shadow: 0 4px 20px rgba(0,0,0,0.3);
            position: relative;
        }

        .card:hover { 
            transform: translateY(-8px) scale(1.02); 
            border-color: rgba(255, 42, 95, 0.5); 
            box-shadow: 0 16px 40px rgba(0, 0, 0, 0.6), 0 0 25px rgba(255, 42, 95, 0.2);
            background: var(--bg-card-hover);
        }
        
        .thumb-container { 
            width: 100%; 
            height: 310px; 
            background: #0f131d; 
            position: relative; 
            overflow: hidden; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            color: var(--text-muted); 
            font-size: 13px; 
        }

        .thumb { 
            width: 100%; 
            height: 100%; 
            object-fit: cover; 
            transition: transform 0.5s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .card:hover .thumb {
            transform: scale(1.08);
        }
        
        .info { 
            padding: 16px; 
            display: flex; 
            flex-direction: column; 
            justify-content: space-between; 
            flex-grow: 1; 
            background: linear-gradient(180deg, rgba(18, 22, 34, 0.2) 0%, rgba(13, 17, 26, 0.9) 100%);
        }

        .item-title { 
            font-size: 14px; 
            font-weight: 700; 
            margin-bottom: 8px; 
            color: #f1f5f9;
            display: -webkit-box; 
            -webkit-line-clamp: 2; 
            -webkit-box-orient: vertical; 
            overflow: hidden; 
            line-height: 1.4;
        }

        .meta { 
            display: flex; 
            justify-content: space-between; 
            font-size: 12px; 
            color: var(--text-muted); 
            font-weight: 500;
        }

        .pagination { 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            gap: 20px; 
            margin-top: 50px; 
            padding-bottom: 30px; 
        }

        .page-btn { 
            background: var(--bg-card); 
            border: 1px solid var(--border-glass); 
            color: var(--text-main); 
            padding: 12px 24px; 
            cursor: pointer; 
            font-weight: 700; 
            border-radius: 10px;
            backdrop-filter: blur(10px);
            transition: all 0.2s ease;
        }

        .page-btn:hover { 
            background: var(--accent); 
            border-color: var(--accent); 
            box-shadow: 0 0 15px rgba(255, 42, 95, 0.4);
        }

        #pageIndicator { 
            font-size: 14px; 
            font-weight: 600; 
            color: var(--text-muted); 
        }

        .modal { 
            display: none; 
            position: fixed; 
            inset: 0; 
            background: rgba(3, 5, 10, 0.85); 
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            z-index: 1000; 
            justify-content: center; 
            align-items: center; 
            flex-direction: column; 
            padding: 20px; 
            animation: fadeIn 0.3s ease;
        }

        .modal-inner { 
            width: 100%; 
            max-width: 1100px; 
            background: rgba(13, 17, 26, 0.85); 
            border: 1px solid var(--border-glass); 
            border-radius: 20px; 
            padding: 24px; 
            box-shadow: 0 25px 60px rgba(0, 0, 0, 0.8), 0 0 40px rgba(255, 42, 95, 0.15); 
            display: flex; 
            flex-direction: column; 
            gap: 20px; 
            backdrop-filter: blur(30px);
        }
        
        .player-frame-container { 
            position: relative; 
            width: 100%; 
            aspect-ratio: 16/9; 
            background: #000; 
            border-radius: 12px; 
            overflow: hidden; 
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        iframe { 
            width: 100%; 
            height: 100%; 
            border: none; 
        }
        
        .modal-header { 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            flex-wrap: wrap; 
            gap: 15px; 
        }

        .server-selector { 
            display: flex; 
            gap: 10px; 
            flex-wrap: wrap; 
        }

        .server-btn { 
            background: rgba(22, 27, 39, 0.7); 
            border: 1px solid var(--border-glass); 
            color: var(--text-muted); 
            padding: 8px 16px; 
            font-size: 12px; 
            font-weight: 600;
            cursor: pointer; 
            border-radius: 8px; 
            transition: all 0.2s ease;
        }

        .server-btn.active { 
            background: var(--accent-gradient); 
            color: white; 
            border-color: transparent; 
            box-shadow: 0 0 15px rgba(255, 42, 95, 0.4);
        }

        .status-bar { 
            grid-column: 1 / -1; 
            text-align: center; 
            padding: 80px 20px; 
            color: var(--text-muted); 
            font-size: 15px; 
            font-weight: 500;
            background: var(--bg-card);
            border: 1px solid var(--border-glass);
            border-radius: 16px;
            backdrop-filter: blur(10px);
        }

        /* Skeleton Pulse Animation */
        .skeleton {
            background: linear-gradient(90deg, rgba(255,255,255,0.03) 25%, rgba(255,255,255,0.08) 50%, rgba(255,255,255,0.03) 75%);
            background-size: 200% 100%;
            animation: shimmer 1.5s infinite;
        }

        @keyframes shimmer {
            0% { background-position: 200% 0; }
            100% { background-position: -200% 0; }
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @media (max-width: 768px) {
            header { padding: 15px 20px; }
            .search-input { width: 100%; }
            .control-cluster { width: 100%; }
            .control-cluster > * { flex: 1; }
        }
    </style>
</head>
<body>

    <header>
        <div class="logo">YAHIARTXHUB</div>
        <div class="control-cluster">
            <input type="text" id="searchInput" class="search-input" placeholder="Search movies globally..." onkeypress="handleKeyQuery(event)">
            <select id="genreSelect" onchange="executeSearch(1)">
                <option value="">All Categories</option>
                <option value="28">Action</option>
                <option value="12">Adventure</option>
                <option value="16">Animation</option>
                <option value="35">Comedy</option>
                <option value="80">Crime</option>
                <option value="18">Drama</option>
                <option value="27">Horror</option>
                <option value="9648">Mystery</option>
                <option value="878">Sci-Fi</option>
                <option value="53">Thriller</option>
            </select>
            <button class="action-btn" onclick="executeSearch(1)">SEARCH</button>
        </div>
    </header>

    <main class="grid" id="portalGrid">
        <div class="status-bar">[*] Connecting to YAHIARTXHUB streaming cluster nodes...</div>
    </main>

    <div class="pagination" id="paginationControls" style="display: none;">
        <button class="page-btn" onclick="changePage(-1)">PREV</button>
        <span id="pageIndicator">SECTOR 1</span>
        <button class="page-btn" onclick="changePage(1)">NEXT</button>
    </div>

    <div class="modal" id="streamModal">
        <div class="modal-inner">
            <div class="modal-header">
                <h3 id="modalTitle" style="color: #f8fafc; font-size: 16px; font-weight: 700;"></h3>
                <div class="server-selector">
                    <button class="server-btn active" onclick="switchServer('vidsrcsu', event)">SERVER 1</button>
                    <button class="server-btn" onclick="switchServer('vidsrcc', event)">SERVER 2</button>
                    <button class="server-btn" onclick="switchServer('embedsu', event)">SERVER 3</button>
                    <button class="server-btn" onclick="switchServer('autoembed', event)">SERVER 4</button>
                </div>
            </div>
            <div class="player-frame-container">
                <iframe id="mediaPlayer" allowfullscreen allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"></iframe>
            </div>
            <button class="action-btn" style="align-self: flex-end; padding: 10px 24px; border-radius: 8px;" onclick="terminateStream()">CLOSE PLAYER</button>
        </div>
    </div>

    <script>
        const TMDB_API_KEY = "3fd2be6f0c70a2a598f084ddfb75487c";
        let currentPage = 1;
        let totalPages = 1;
        let activeMovieId = null;

        async function executeSearch(page = 1) {
            currentPage = page;
            const query = document.getElementById('searchInput').value.trim();
            const genre = document.getElementById('genreSelect').value;
            const grid = document.getElementById('portalGrid');
            const pagination = document.getElementById('paginationControls');

            grid.innerHTML = `<div class="status-bar skeleton" style="height: 150px; display: flex; align-items: center; justify-content: center;">[*] Querying YAHIARTXHUB streaming cluster... (Sector ${currentPage})</div>`;

            let url = '';
            if (query) {
                url = `https://api.themoviedb.org/3/search/movie?api_key=${TMDB_API_KEY}&query=${encodeURIComponent(query)}&page=${currentPage}`;
            } else if (genre) {
                url = `https://api.themoviedb.org/3/discover/movie?api_key=${TMDB_API_KEY}&with_genres=${genre}&sort_by=popularity.desc&page=${currentPage}`;
            } else {
                url = `https://api.themoviedb.org/3/discover/movie?api_key=${TMDB_API_KEY}&sort_by=popularity.desc&page=${currentPage}`;
            }

            try {
                const response = await fetch(url);
                const data = await response.json();
                totalPages = data.total_pages || 1;
                renderGrid(data.results || []);
                
                if (data.results && data.results.length > 0) {
                    pagination.style.display = 'flex';
                    document.getElementById('pageIndicator').innerText = `SECTOR ${currentPage} / ${totalPages}`;
                } else {
                    pagination.style.display = 'none';
                }
            } catch (err) {
                grid.innerHTML = '<div class="status-bar" style="color: var(--accent);">[!] Handshake failed with YAHIARTXHUB registry.</div>';
                pagination.style.display = 'none';
            }
        }

        function renderGrid(movies) {
            const grid = document.getElementById('portalGrid');
            grid.innerHTML = '';

            if (movies.length === 0) {
                grid.innerHTML = '<div class="status-bar">[!] Zero media nodes located matching your query.</div>';
                return;
            }

            movies.forEach(movie => {
                const title = movie.title || movie.original_title;
                const year = (movie.release_date || '2026').split('-')[0];
                const poster = movie.poster_path ? `https://image.tmdb.org/t/p/w500${movie.poster_path}` : 'https://images.unsplash.com/photo-1489599849927-2ee91cede3ba?w=500&auto=format&fit=crop&q=60';
                const rating = movie.vote_average ? movie.vote_average.toFixed(1) : 'N/A';

                const card = document.createElement('div');
                card.className = 'card';
                card.onclick = () => openStream(movie.id, title);

                card.innerHTML = `
                    <div class="thumb-container">
                        <img class="thumb" src="${poster}" alt="${title}" onerror="this.style.display='none'">
                    </div>
                    <div class="info">
                        <div class="item-title">${title}</div>
                        <div class="meta">
                            <span>${year}</span>
                            <span>★ ${rating}</span>
                        </div>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        function changePage(direction) {
            const newPage = currentPage + direction;
            if (newPage >= 1 && newPage <= totalPages) {
                executeSearch(newPage);
                window.scrollTo({ top: 0, behavior: 'smooth' });
            }
        }

        function openStream(tmdbId, title) {
            activeMovieId = tmdbId;
            document.getElementById('modalTitle').innerText = title;
            document.getElementById('mediaPlayer').src = `https://vidsrc.su/embed/movie/${tmdbId}`;
            document.getElementById('streamModal').style.display = 'flex';
            
            document.querySelectorAll('.server-btn').forEach((b, idx) => {
                if (idx === 0) b.classList.add('active');
                else b.classList.remove('active');
            });
        }

        function switchServer(serverType, event) {
            const iframe = document.getElementById('mediaPlayer');
            document.querySelectorAll('.server-btn').forEach(b => b.classList.remove('active'));
            event.target.classList.add('active');

            if (serverType === 'vidsrcsu') {
                iframe.src = `https://vidsrc.su/embed/movie/${activeMovieId}`;
            } else if (serverType === 'vidsrcc') {
                iframe.src = `https://vidsrc.cc/v2/embed/movie/${activeMovieId}`;
            } else if (serverType === 'embedsu') {
                iframe.src = `https://embed.su/embed/movie/${activeMovieId}`;
            } else if (serverType === 'autoembed') {
                iframe.src = `https://autoembed.cc/embed/movie/${activeMovieId}`;
            }
        }

        function terminateStream() {
            const modal = document.getElementById('streamModal');
            const iframe = document.getElementById('mediaPlayer');
            iframe.src = '';
            modal.style.display = 'none';
        }

        function handleKeyQuery(e) {
            if (e.key === 'Enter') {
                executeSearch(1);
            }
        }

        // Initialize default global feed load on startup
        executeSearch(1);
    </script>
</body>
</html>
